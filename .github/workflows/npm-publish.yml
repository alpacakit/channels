name: Release

# Publishes @alpacakit/channels.
# - Push a tag `vX.Y.Z` (or `vX.Y.Z-beta.N`): the tag must equal package.json's version.
#   A plain version goes to `latest`, a version with `-` to `beta`. A GitHub Release with PR notes is created.
# - Run this workflow by hand on any branch: publishes `0.0.0-canary.<UTC time>.<sha>` to `canary` only.
# npm authentication uses Trusted Publishing (OIDC); no npm token is stored.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify (build + lint + typecheck + test)
        run: pnpm verify

      - name: Decide version and dist-tag
        id: release
        shell: bash
        run: |
          committed="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$committed" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $committed."
              exit 1
            fi
            if [[ "$version" == *-* ]]; then dist_tag=beta; prerelease=true; else dist_tag=latest; prerelease=false; fi
          else
            version="0.0.0-canary.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short=7 HEAD)"
            dist_tag=canary; prerelease=true
            npm pkg set version="$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        shell: bash
        run: |
          npm install --global npm@^11.5.1
          if npm view "@alpacakit/channels@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "@alpacakit/channels@${{ steps.release.outputs.version }} is already on npm."
          else
            npm publish --tag "${{ steps.release.outputs.dist_tag }}" --access public
          fi

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease --latest=false); fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "${flags[@]}"

      - name: Summary
        run: echo "Published @alpacakit/channels@${{ steps.release.outputs.version }} with dist-tag ${{ steps.release.outputs.dist_tag }}" >> "$GITHUB_STEP_SUMMARY"
